<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>sogno · a neural network dreams a falling-sand game</title>
  <meta name="description" content="Draw sand, water and fire into two worlds: the real falling-sand game, and a 1.2M-parameter network that only imagines it. Running on your GPU with WebGPU.">
  <meta name="theme-color" content="#10121a">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>sogno</h1>
      <p>Draw in either world. On the left, <a href="https://github.com/AndreaAcanfora/sabbia">sabbia</a>'s real rules.
        On the right, a small neural network that has only watched the game, and dreams every frame of it.
        <a href="https://github.com/AndreaAcanfora/sogno">How it works</a></p>
    </header>
    <div id="stage">
      <figure>
        <canvas id="real" aria-label="The real game: draw with the mouse or your finger"></canvas>
        <figcaption>real <span id="real-note"></span></figcaption>
      </figure>
      <figure>
        <canvas id="dream" aria-label="The dream: draw with the mouse or your finger"></canvas>
        <figcaption>dream <span id="dream-note"></span></figcaption>
      </figure>
      <div id="message" hidden></div>
    </div>
    <nav id="toolbar" aria-label="Materials and controls">
      <div id="palette" role="radiogroup" aria-label="Material"></div>
      <div id="controls">
        <div class="group" role="radiogroup" aria-label="Brush size">
          <button class="size" data-size="1" title="Small brush ( [ )">•</button>
          <button class="size active" data-size="3" title="Medium brush">●</button>
          <button class="size" data-size="6" title="Large brush ( ] )">⬤</button>
        </div>
        <div class="group">
          <button id="pause" title="Pause (space)">❚❚</button>
          <button id="scene" title="A new random scene (N)">New scene</button>
          <button id="wake" title="Copy the real world into the dream (W)">Wake up</button>
        </div>
        <label class="group" title="0 always picks the most likely material; higher is livelier, and drifts sooner">
          temperature <input id="temperature" type="range" min="0" max="1" step="0.05" value="0.5">
        </label>
        <div id="stats" aria-live="off"></div>
      </div>
    </nav>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>

[package]
name = "sogno-gen"
version = "0.1.0"
edition = "2024"
description = "Training data for sogno: sabbia episodes played by a scripted painter"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "sogno-gen"
path = "src/main.rs"

# The real game engine is the only dependency: the data comes from the exact rules the browser runs.
[dependencies]
sabbia = { git = "https://github.com/AndreaAcanfora/sabbia", rev = "6cef23fbbf47099122087dc93d66324c97d44e58" }

[profile.release]
opt-level = 3

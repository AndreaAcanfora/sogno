[package]
name = "sogno-gen"
version = "0.1.0"
edition = "2024"
description = "Training data for sogno: sabbia episodes played by a scripted painter"
license = "MIT"
publish = false

[[bin]]
name = "sogno-gen"
path = "src/main.rs"

# The real game engine is the only dependency: the data comes from the exact rules the browser runs.
[dependencies]
sabbia = { git = "https://github.com/AndreaAcanfora/sabbia", rev = "5c97a48345f92688ca954b07ebc0d35f16876246" }

[profile.release]
opt-level = 3
